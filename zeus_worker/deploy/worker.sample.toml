# Cấu hình mẫu thin worker -> chép thành /etc/zeus-worker/worker.toml (0640 root:zeus-worker).
# Token KHÔNG để ở đây: /etc/zeus-worker/token (0600) do admin phát hành (zeus-core cấp token riêng mỗi worker).

[server]
url = "http://10.90.30.10:8080"          # zeus-core trên br-core; bridge agent chỉ tới /worker/v1/*
token_file = "/etc/zeus-worker/token"

[worker]
worker_id = "w-code-1"
kind = "linux_vm"
tenant_scope = ["zeusvn"]
network_zone = "agent"                   # core | agent | ops | erp_test | dmz
capabilities = ["python", "git", "build", "odoo_addon_dev"]
data_localities = ["repo:erp-addons"]
max_concurrent = 2
work_dir = "/var/lib/zeus-worker"

[executors]
# http.fetch chỉ tới domain trong danh sách (rỗng = từ chối hết). Dấu chấm đầu = cả subdomain.
http_allow_domains = ["zeusvn.vn", ".zeusvn.vn"]
file_roots = ["/var/lib/zeus-worker/work"]
repo_roots = ["/var/lib/zeus-worker/work"]

# shell.allowlisted: TÊN -> argv cố định. Không nhận tham số từ bên ngoài.
[executors.shell_allowlist]
disk_usage = ["df", "-h", "/"]
