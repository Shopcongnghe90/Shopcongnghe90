# /etc/modprobe.d/zfs-may-ao.conf
# Giới hạn ZFS ARC để không tranh RAM với 8 instance (51 GiB) + ERP production (dự phòng 16 GiB) trên host 80 GiB.
# cai-incus.sh thay __ZFS_ARC_MAX__ bằng giá trị trong bien-moi-truong.env (mặc định 4 GiB).
# Có hiệu lực sau khi reboot hoặc update-initramfs; áp dụng nóng:
#   echo <byte> > /sys/module/zfs/parameters/zfs_arc_max
options zfs zfs_arc_max=__ZFS_ARC_MAX__
