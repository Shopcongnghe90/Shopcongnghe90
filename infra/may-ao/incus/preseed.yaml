# preseed.yaml — mẫu cho `incus admin init --preseed`.
# cai-incus.sh sẽ thay dòng giữ chỗ dưới `config:` của pool bằng:
#   source: /dev/nvme1n1     (đĩa riêng — khuyến nghị)   hoặc
#   size: 600GiB             (tệp loop /var/lib/incus/disks/may-ao.img — chỉ để thử)
#
# Ba điểm quan trọng của thiết kế:
#   1. core.https_address để trống → API Incus chỉ qua unix socket, không phơi ra mạng.
#   2. Hai bridge tách biệt: br-agent (6 máy agent) và br-erp (ERP thử nghiệm).
#      Việc CHẶN qua lại giữa hai bridge do mang/cach-ly-erp.nft đảm nhiệm.
#   3. Profile `default` chỉ có đĩa gốc, KHÔNG có card mạng → máy nào tạo nhầm
#      bằng profile default sẽ không có mạng, tránh "rò" ra ngoài kế hoạch.
config:
  core.https_address: ""
  images.auto_update_interval: "24"

networks:
  - name: br-agent
    type: bridge
    description: "Mạng 6 máy agent (Zalo x2, tìm hàng, Facebook, bán hàng, hệ thống)"
    config:
      ipv4.address: 10.90.10.1/24
      ipv4.nat: "true"
      ipv4.dhcp: "true"
      ipv4.dhcp.ranges: 10.90.10.100-10.90.10.199
      ipv6.address: none
      dns.domain: agent.may-ao
  - name: br-erp
    type: bridge
    description: "Mạng riêng cho ERP thử nghiệm — cách ly khỏi agent bằng nftables"
    config:
      ipv4.address: 10.90.20.1/24
      ipv4.nat: "true"
      ipv4.dhcp: "true"
      ipv4.dhcp.ranges: 10.90.20.100-10.90.20.199
      ipv6.address: none
      dns.domain: erp.may-ao

storage_pools:
  - name: may-ao
    driver: zfs
    description: "Pool ZFS cho 7 máy ảo + snapshot đêm"
    config:
      __NGUON_POOL__

profiles:
  - name: default
    description: "Mặc định: chỉ đĩa gốc, KHÔNG mạng (cố ý)"
    config: {}
    devices:
      root:
        path: /
        pool: may-ao
        type: disk

projects: []
cluster: null
