; /opt/erp/config/odoo.conf — cấu hình Odoo mẫu (tao-may.sh đẩy vào cùng compose)
; admin_passwd (mật khẩu quản trị DB) được tao-may.sh thay từ /opt/erp/.env
[options]
admin_passwd = __ODOO_ADMIN_MAT_KHAU__
db_host = db
db_port = 5432
db_user = odoo
db_password = __DB_MAT_KHAU__
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
proxy_mode = False
list_db = True
