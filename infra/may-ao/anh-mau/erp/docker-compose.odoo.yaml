# docker-compose.odoo.yaml — ERP MẪU: Odoo 19 + PostgreSQL 16 (staging; xác nhận major version khớp production).
# tao-may.sh erp-odoo-mau đẩy tệp này vào /opt/erp/docker-compose.yaml trong máy ERP.
# Mật khẩu đọc từ /opt/erp/.env (DB_MAT_KHAU, ODOO_ADMIN_MAT_KHAU) do cloud-init sinh.
# Thay bằng ERP thật của shop nếu cần — máy & mạng cách ly không đổi.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_MAT_KHAU}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    image: odoo:${ODOO_TAG:-19.0}
    depends_on:
      db:
        condition: service_healthy
    # Chỉ lắng nghe trong máy ERP; từ host/admin vào qua IP 10.90.20.11:8069 (nftables chỉ mở zeus-core và w-code-1/2)
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_MAT_KHAU}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
    restart: unless-stopped

volumes:
  db: {}
  odoo-data: {}
