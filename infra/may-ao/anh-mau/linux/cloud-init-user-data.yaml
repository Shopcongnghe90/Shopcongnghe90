#cloud-config
# =============================================================================
#  ẢNH MẪU AGENT LINUX — Ubuntu 24.04 (images:ubuntu/24.04/cloud, máy ảo Incus)
# =============================================================================
#  Cài vào máy:
#    - Màn hình ảo nhẹ: TigerVNC (Xvnc :1, 1600x900) + XFCE tối giản (không screensaver/khoá)
#    - noVNC trên cổng 6080 (chỉ nên truy cập từ host qua SSH tunnel)
#    - Google Chrome (kênh stable) chạy sẵn với cổng gỡ lỗi 9222, hồ sơ riêng
#    - Node.js 22 + chrome-devtools-mcp (để Claude điều khiển Chrome)
#    - Claude Code (bộ cài gốc) chạy `claude remote-control` như dịch vụ systemd
#  KHÔNG chứa bí mật. Token Claude + mật khẩu VNC được tao-may.sh đẩy vào sau
#  (lệnh `tao-may.sh bi-mat <may>`), nên có thể publish thành ảnh mẫu an toàn.
#
#  Tên máy: Incus tự đặt theo tên instance (qua metadata NoCloud).
#  Nạp vào profile: tao-may.sh thiet-lap  (incus profile set agent-linux cloud-init.user-data "$(cat tệp này)")
# =============================================================================

timezone: Asia/Ho_Chi_Minh
locale: en_US.UTF-8

package_update: true
package_upgrade: true
package_reboot_if_required: false

apt:
  conf: |
    APT::Install-Recommends "false";
    APT::Install-Suggests "false";
    Dpkg::Options { "--force-confdef"; "--force-confold"; };

users:
  - name: agent
    gecos: Claude Agent
    uid: "1000"
    primary_group: agent
    groups: [sudo, adm, audio, video, plugdev]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true

ssh_pwauth: false

# Chrome hay vọt RAM: thêm 2 GiB swap tệp để máy không bị OOM
swap:
  filename: /swap.img
  size: 2G
  maxsize: 2G

packages:
  # Màn hình ảo + XFCE tối giản
  - tigervnc-standalone-server
  - tigervnc-common
  - novnc
  - websockify
  - xfce4
  - xfce4-terminal
  - xfce4-notifyd
  - elementary-xfce-icon-theme
  - greybird-gtk-theme
  - dbus-x11
  - at-spi2-core
  - xauth
  - xfonts-base
  - x11-xserver-utils
  - x11-utils
  - xdg-utils
  - fonts-noto-core
  - fonts-dejavu-core
  - fonts-liberation
  # Công cụ cho agent thao tác màn hình
  - xdotool
  - wmctrl
  - scrot
  - libnotify-bin
  # Tiện ích chung
  - curl
  - wget
  - ca-certificates
  - gnupg
  - git
  - jq
  - unzip
  - zip
  - ripgrep
  - tmux
  - htop
  - python3
  - python3-pip
  - python3-venv
  - locales
  - util-linux

write_files:
  # ---------------------------------------------------------------------------
  # 1. Xvnc :N — màn hình ảo (dịch vụ hệ thống chạy dưới user agent)
  # ---------------------------------------------------------------------------
  - path: /etc/systemd/system/xvnc@.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Màn hình ảo TigerVNC :%i (user agent)
      After=network.target

      [Service]
      Type=simple
      User=agent
      Group=agent
      PAMName=login
      Environment=HOME=/home/agent
      Environment=XAUTHORITY=/home/agent/.Xauthority
      ExecStartPre=/usr/local/bin/tao-xauth.sh %i
      ExecStart=/usr/bin/Xvnc :%i -geometry 1600x900 -depth 24 -rfbport 590%i -localhost -SecurityTypes VncAuth -PasswordFile /home/agent/.vnc/passwd -AlwaysShared -desktop agent -auth /home/agent/.Xauthority
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/tao-xauth.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Tạo cookie xauth cho màn hình :$1 (chạy dưới user agent)
      set -e
      F=/home/agent/.Xauthority
      touch "$F"
      xauth -f "$F" remove ":$1" >/dev/null 2>&1 || true
      xauth -f "$F" add ":$1" . "$(mcookie)"

  - path: /usr/local/bin/cho-x-san-sang.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Chờ tối đa 30 giây cho socket X của màn hình :$1 xuất hiện
      i=0
      while [ "$i" -lt 60 ]; do
        [ -S "/tmp/.X11-unix/X$1" ] && exit 0
        sleep 0.5; i=$((i+1))
      done
      echo "Màn hình :$1 chưa sẵn sàng" >&2
      exit 1

  # ---------------------------------------------------------------------------
  # 2. Phiên XFCE trên màn hình :N
  # ---------------------------------------------------------------------------
  - path: /etc/systemd/system/xfce@.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Phiên XFCE trên màn hình :%i (user agent)
      Requires=xvnc@%i.service
      After=xvnc@%i.service

      [Service]
      Type=simple
      User=agent
      Group=agent
      PAMName=login
      WorkingDirectory=/home/agent
      Environment=HOME=/home/agent
      Environment=DISPLAY=:%i
      Environment=XAUTHORITY=/home/agent/.Xauthority
      Environment=LANG=en_US.UTF-8
      ExecStartPre=/usr/local/bin/cho-x-san-sang.sh %i
      ExecStart=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  # ---------------------------------------------------------------------------
  # 3. noVNC — web VNC cổng 6080 → Xvnc :1 (5901)
  # ---------------------------------------------------------------------------
  - path: /etc/systemd/system/novnc.service
    permissions: "0644"
    content: |
      [Unit]
      Description=noVNC (websockify) cổng 6080 -> VNC :1
      Wants=xvnc@1.service
      After=xvnc@1.service network.target

      [Service]
      Type=simple
      User=agent
      Group=agent
      ExecStart=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5901
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  # ---------------------------------------------------------------------------
  # 4. Claude Code remote-control như dịch vụ
  #    Chỉ chạy khi /etc/claude-agent/env tồn tại (tao-may.sh bi-mat tạo tệp này).
  # ---------------------------------------------------------------------------
  - path: /etc/systemd/system/claude-remote-control.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Claude Code remote-control (agent %H)
      Wants=network-online.target xfce@1.service
      After=network-online.target xfce@1.service
      ConditionPathExists=/etc/claude-agent/env

      [Service]
      Type=simple
      User=agent
      Group=agent
      PAMName=login
      WorkingDirectory=/home/agent/work
      EnvironmentFile=/etc/claude-agent/env
      Environment=HOME=/home/agent
      Environment=DISPLAY=:1
      Environment=XAUTHORITY=/home/agent/.Xauthority
      Environment=PATH=/home/agent/.local/bin:/usr/local/bin:/usr/bin:/bin
      Environment=TERM=xterm-256color
      Environment=LANG=en_US.UTF-8
      ExecStart=/usr/local/bin/claude-remote-control.sh
      Restart=always
      RestartSec=20
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/claude-remote-control.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Chạy `claude remote-control` trong pty giả (Claude Code cần TTY).
      # Biến từ /etc/claude-agent/env:
      #   CLAUDE_CODE_OAUTH_TOKEN  (hoặc ANTHROPIC_API_KEY)  — bắt buộc một trong hai
      #   AGENT_TEN                — tên phiên hiển thị trên claude.ai (mặc định: hostname)
      #   CLAUDE_RC_THAM_SO        — tham số thêm cho claude remote-control (tuỳ chọn)
      set -euo pipefail
      if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" && -z "${ANTHROPIC_API_KEY:-}" ]]; then
        echo "Thiếu CLAUDE_CODE_OAUTH_TOKEN/ANTHROPIC_API_KEY trong /etc/claude-agent/env" >&2
        exit 78
      fi
      if ! command -v claude >/dev/null 2>&1; then
        echo "Chưa cài claude (xem /var/log/cloud-init-output.log)" >&2
        exit 69
      fi
      TEN="${AGENT_TEN:-$(hostname)}"
      cd /home/agent/work
      echo "Khởi động Claude Code remote-control, tên phiên: $TEN ($(claude --version 2>/dev/null || echo '?'))"
      # shellcheck disable=SC2086
      exec /usr/bin/script -qfec "claude remote-control --name '$TEN' ${CLAUDE_RC_THAM_SO:-}" /dev/null

  - path: /etc/claude-agent/env.mau
    permissions: "0600"
    content: |
      # Sao chép thành /etc/claude-agent/env (quyền 0600, root) rồi: systemctl start claude-remote-control
      # tao-may.sh bi-mat <may> làm tự động từ bien-moi-truong.env trên host.
      CLAUDE_CODE_OAUTH_TOKEN=
      AGENT_TEN=
      # CLAUDE_RC_THAM_SO=

  # ---------------------------------------------------------------------------
  # 4b. Mật khẩu VNC tạm: sinh ngẫu nhiên khi máy CHƯA có /home/agent/.vnc/passwd
  #     (lần đầu và trên mọi máy nhân bản từ ảnh mẫu). tao-may.sh bi-mat sẽ đặt lại.
  # ---------------------------------------------------------------------------
  - path: /usr/local/bin/vnc-mat-khau-tam.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      set -e
      [ -f /home/agent/.vnc/passwd ] && exit 0
      install -d -o agent -g agent -m 0700 /home/agent/.vnc
      install -d -m 0700 /etc/claude-agent
      P=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 8)
      printf '%s' "$P" | vncpasswd -f > /home/agent/.vnc/passwd
      chown agent:agent /home/agent/.vnc/passwd; chmod 600 /home/agent/.vnc/passwd
      printf 'VNC_MAT_KHAU_TAM=%s\n' "$P" > /etc/claude-agent/vnc-tam; chmod 600 /etc/claude-agent/vnc-tam

  - path: /etc/systemd/system/vnc-mat-khau-tam.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Sinh mật khẩu VNC tạm nếu chưa có
      Before=xvnc@1.service
      ConditionPathExists=!/home/agent/.vnc/passwd

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/vnc-mat-khau-tam.sh

      [Install]
      WantedBy=multi-user.target

  # ---------------------------------------------------------------------------
  # 5. Chrome cho agent (tự chạy khi vào XFCE) + cấu hình Claude Code
  # ---------------------------------------------------------------------------
  - path: /usr/local/bin/chrome-agent.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Chrome có cổng gỡ lỗi 9222. Chrome >= 136 bắt buộc --user-data-dir khác mặc định.
      exec /usr/bin/google-chrome-stable \
        --remote-debugging-port=9222 \
        --user-data-dir=/home/agent/.config/chrome-agent \
        --no-first-run --no-default-browser-check \
        --password-store=basic \
        --disable-session-crashed-bubble --hide-crash-restore-bubble \
        --start-maximized --lang=vi \
        about:blank

  - path: /home/agent/.config/autostart/chrome-agent.desktop
    owner: agent:agent
    permissions: "0644"
    defer: true
    content: |
      [Desktop Entry]
      Type=Application
      Name=Chrome (agent, cổng 9222)
      Exec=/usr/local/bin/chrome-agent.sh
      X-GNOME-Autostart-enabled=true

  - path: /home/agent/work/.mcp.json
    owner: agent:agent
    permissions: "0644"
    defer: true
    content: |
      {
        "mcpServers": {
          "chrome-devtools": {
            "command": "chrome-devtools-mcp",
            "args": ["--browserUrl=http://127.0.0.1:9222"]
          }
        }
      }

  - path: /home/agent/work/.claude/settings.json
    owner: agent:agent
    permissions: "0644"
    defer: true
    content: |
      {
        "enableAllProjectMcpServers": true
      }

  # Bỏ hộp thoại đầu tiên (chọn giao diện, tin thư mục) để dịch vụ không bị treo chờ
  - path: /home/agent/.claude.json
    owner: agent:agent
    permissions: "0600"
    defer: true
    content: |
      {
        "hasCompletedOnboarding": true,
        "theme": "dark",
        "projects": {
          "/home/agent/work": { "hasTrustDialogAccepted": true }
        }
      }

  - path: /home/agent/work/CLAUDE.md
    owner: agent:agent
    permissions: "0644"
    defer: true
    content: |
      # Agent Claude (ảnh mẫu — chưa gán vai trò)
      Máy ảo Incus của Shopcongnghe90. tao-may.sh sẽ thay tệp này bằng vai trò cụ thể (vai-tro/*.md).

  # Tắt khoá màn hình/ngủ của XFCE (không có màn hình thật)
  - path: /home/agent/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-screensaver.xml
    owner: agent:agent
    permissions: "0644"
    defer: true
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <channel name="xfce4-screensaver" version="1.0">
        <property name="saver" type="empty">
          <property name="enabled" type="bool" value="false"/>
        </property>
        <property name="lock" type="empty">
          <property name="enabled" type="bool" value="false"/>
        </property>
      </channel>

runcmd:
  # --- Thư mục & quyền ---
  - [ bash, -c, "install -d -o agent -g agent -m 0700 /home/agent/.vnc /home/agent/.config /home/agent/.local/bin" ]
  - [ bash, -c, "install -d -o agent -g agent -m 0755 /home/agent/work /home/agent/work/ghi-chu /home/agent/work/du-lieu /home/agent/work/kich-ban /home/agent/work/script" ]
  - [ bash, -c, "install -d -m 0700 /etc/claude-agent" ]
  - [ loginctl, enable-linger, agent ]
  # Bảng XFCE: dùng cấu hình mặc định để không hiện hộp thoại "lần đầu chạy panel"
  - [ bash, -c, "install -d -o agent -g agent /home/agent/.config/xfce4/xfconf/xfce-perchannel-xml && [ -f /etc/xdg/xfce4/panel/default.xml ] && cp /etc/xdg/xfce4/panel/default.xml /home/agent/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml && chown agent:agent /home/agent/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml || true" ]
  # --- Google Chrome (kho apt chính thức) ---
  - [ bash, -c, "curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg" ]
  - [ bash, -c, "echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main' > /etc/apt/sources.list.d/google-chrome.list" ]
  - [ bash, -c, "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq google-chrome-stable" ]
  # --- Node.js 22 (NodeSource) + chrome-devtools-mcp ---
  - [ bash, -c, "curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs" ]
  - [ bash, -c, "npm install -g chrome-devtools-mcp@latest" ]
  # --- Claude Code (bộ cài gốc, vào /home/agent/.local/bin/claude) ---
  - [ bash, -c, "sudo -u agent -H bash -c 'curl -fsSL https://claude.ai/install.sh | bash' && ln -sf /home/agent/.local/bin/claude /usr/local/bin/claude" ]
  # --- Dịch vụ ---
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, vnc-mat-khau-tam.service, xvnc@1.service, xfce@1.service, novnc.service ]
  - [ systemctl, enable, claude-remote-control.service ]
  # --- Dấu phiên bản ảnh mẫu ---
  - [ bash, -c, "printf 'anh-mau-agent-linux %s\\n' \"$(date -u +%FT%TZ)\" > /etc/may-ao-anh-mau" ]
  - [ bash, -c, "apt-get clean" ]

final_message: |
  ===== Ảnh mẫu agent Linux đã dựng xong sau $UPTIME giây =====
  - noVNC:   http://<ip-may>:6080/vnc.html   (mật khẩu tạm: xem /etc/claude-agent/vnc-tam)
  - Chrome:  cổng gỡ lỗi 9222 trong máy
  - Claude:  chờ /etc/claude-agent/env → systemctl start claude-remote-control
  Trên host: bash tao-may.sh bi-mat <ten-may>
