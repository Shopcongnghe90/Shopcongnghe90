#cloud-config
# Cloud-init TỐI GIẢN cho máy tạo TỪ ẢNH MẪU zeus-worker-mau (mọi thứ đã cài sẵn trong ảnh).
# Nạp vào hồ sơ zeus-worker-tu-mau bởi tao-may.sh thiet-lap.
# Khoá SSH host, machine-id được sinh lại ở lần khởi động đầu (tao-anh-mau.sh đã xoá chúng).
users: []
timezone: Asia/Ho_Chi_Minh
final_message: |
  Máy từ ảnh mẫu sẵn sàng sau $UPTIME giây.
  Trên host: bash tao-may.sh dua-worker <ten-may>
