# may/facebook.yaml — cấu hình RIÊNG cho máy "facebook" (loại: linux).
# Dùng: incus init <ảnh> facebook --vm -p may-ao-chung -p <hồ sơ> < may/facebook.yaml
# (tao-may.sh tao facebook làm việc này.)
#
# Ghim nhân E: i9-13900 = 8 nhân P (CPU logic 0-15, có SMT) + 16 nhân E (CPU logic 16-31).
# Chạy kiem-tra.sh để xác nhận; nếu danh sách E khác 16-31 thì sửa limits.cpu bên dưới.
# Với máy ảo, limits.cpu dạng khoảng = ghim 1:1 (số vCPU = số CPU trong khoảng).
description: "Linux — agent Facebook: fanpage, nhóm, tin nhắn (Chrome + Claude Code)"
config:
  limits.cpu: "22-23"
  limits.memory: 6GiB
devices:
  eth0:
    type: nic
    network: br-agent
    name: eth0
    # Địa chỉ cố định (cấp qua DHCP của Incus) — nằm ngoài dải động .100-.199
    ipv4.address: 10.90.10.22
  root:
    type: disk
    pool: may-ao
    path: /
    size: 40GiB
