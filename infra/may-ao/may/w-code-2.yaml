# may/w-code-2.yaml — VM thin worker. Dùng: tao-may.sh tao w-code-2 (bảng instance: docs/architecture mục 4).
# Ghim: nhân E = CPU logic 16-31, P-thread 14-15 cho zeus-gpu; nhân P 0-13 dành cho host + ERP production.
description: "w-code-2: worker thứ hai (song song / SaaS build)"
config:
  limits.cpu: "24-25"
  limits.memory: 6GiB
devices:
  eth0:
    type: nic
    network: br-agent
    name: eth0
    ipv4.address: 10.90.10.22
  root:
    type: disk
    pool: may-ao
    path: /
    size: 60GiB
