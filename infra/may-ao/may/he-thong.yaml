# may/he-thong.yaml — cấu hình RIÊNG cho máy "he-thong" (loại: linux).
# Dùng: incus init <ảnh> he-thong --vm -p may-ao-chung -p <hồ sơ> < may/he-thong.yaml
# (tao-may.sh tao he-thong làm việc này.)
#
# Ghim nhân E: i9-13900 = 8 nhân P (CPU logic 0-15, có SMT) + 16 nhân E (CPU logic 16-31).
# Chạy kiem-tra.sh để xác nhận; nếu danh sách E khác 16-31 thì sửa limits.cpu bên dưới.
# Với máy ảo, limits.cpu dạng khoảng = ghim 1:1 (số vCPU = số CPU trong khoảng).
description: "Linux — agent hệ thống: giám sát, script, tự động hoá nội bộ"
config:
  limits.cpu: "26-27"
  limits.memory: 6GiB
devices:
  eth0:
    type: nic
    network: br-agent
    name: eth0
    # Địa chỉ cố định (cấp qua DHCP của Incus) — nằm ngoài dải động .100-.199
    ipv4.address: 10.90.10.24
  root:
    type: disk
    pool: may-ao
    path: /
    size: 40GiB
