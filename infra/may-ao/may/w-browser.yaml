# may/w-browser.yaml — VM thin worker. Dùng: tao-may.sh tao w-browser (bảng instance: docs/architecture mục 4).
# Ghim: nhân E = CPU logic 16-31, P-thread 14-15 cho zeus-gpu; nhân P 0-13 dành cho host + ERP production.
description: "w-browser: headless Chromium/Playwright: visual QA, kiểm tra site"
config:
  limits.cpu: "26-27"
  limits.memory: 6GiB
devices:
  eth0:
    type: nic
    network: br-agent
    name: eth0
    ipv4.address: 10.90.10.23
  root:
    type: disk
    pool: may-ao
    path: /
    size: 40GiB
