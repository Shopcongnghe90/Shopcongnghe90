# may/zeus-core.yaml — VM. Dùng: tao-may.sh tao zeus-core (bảng instance: docs/architecture mục 4).
# Ghim: nhân E = CPU logic 16-31, P-thread 14-15 cho zeus-gpu; nhân P 0-13 dành cho host + ERP production.
description: "zeus-core: Control API, Event Gateway, Temporal, Postgres16+pgvector, Workbench, artifact store"
config:
  limits.cpu: "16-19"
  limits.memory: 12GiB
devices:
  eth0:
    type: nic
    network: br-core
    name: eth0
    ipv4.address: 10.90.30.10
  root:
    type: disk
    pool: may-ao
    path: /
    size: 150GiB
