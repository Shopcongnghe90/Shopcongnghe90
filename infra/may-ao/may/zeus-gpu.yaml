# may/zeus-gpu.yaml — Container nvidia.runtime. Dùng: tao-may.sh tao zeus-gpu (bảng instance: docs/architecture mục 4).
# Ghim: nhân E = CPU logic 16-31, P-thread 14-15 cho zeus-gpu; nhân P 0-13 dành cho host + ERP production.
description: "zeus-gpu: llama.cpp Qwen3.5-9B Q4_K_M + embedding + OCR"
config:
  limits.cpu: "14-15"
  limits.memory: 6GiB
devices:
  eth0:
    type: nic
    network: br-core
    name: eth0
    ipv4.address: 10.90.30.20
  root:
    type: disk
    pool: may-ao
    path: /
    size: 60GiB
