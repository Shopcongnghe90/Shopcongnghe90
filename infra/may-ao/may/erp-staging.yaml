# may/erp-staging.yaml — VM. Dùng: tao-may.sh tao erp-staging (bảng instance: docs/architecture mục 4).
# Ghim: nhân E = CPU logic 16-31, P-thread 14-15 cho zeus-gpu; nhân P 0-13 dành cho host + ERP production.
description: "erp-staging: Odoo 19 staging (dữ liệu đã làm sạch PII)"
config:
  limits.cpu: "30-31"
  limits.memory: 8GiB
  snapshots.expiry: "14d"
devices:
  eth0:
    type: nic
    network: br-erp-test
    name: eth0
    ipv4.address: 10.90.20.11
  root:
    type: disk
    pool: may-ao
    path: /
    size: 80GiB
