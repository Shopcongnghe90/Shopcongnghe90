# may/w-ops.yaml — VM thin worker. Dùng: tao-may.sh tao w-ops (bảng instance: docs/architecture mục 4).
# Ghim: nhân E = CPU logic 16-31, P-thread 14-15 cho zeus-gpu; nhân P 0-13 dành cho host + ERP production.
description: "w-ops: Server Engineer lane: inspect, backup verify, monitoring (không credential production mặc định)"
config:
  limits.cpu: "28-29"
  limits.memory: 4GiB
devices:
  eth0:
    type: nic
    network: br-ops
    name: eth0
    ipv4.address: 10.90.40.10
  root:
    type: disk
    pool: may-ao
    path: /
    size: 40GiB
