# Cấu hình thin worker cho w-browser -> /etc/zeus-worker/worker.toml (tao-may.sh dua-worker w-browser).
# Token riêng: bi-mat/w-browser.token (admin phát hành trên zeus-core, KHÔNG commit) -> /etc/zeus-worker/token (0600).
[server]
url = "__ZEUS_SERVER_URL__"
token_file = "/etc/zeus-worker/token"

[worker]
worker_id = "w-browser"
kind = "linux_vm"
tenant_scope = ["zeusvn"]
network_zone = "agent"
capabilities = ["browser", "playwright", "visual_qa"]
data_localities = ["cache:website"]
max_concurrent = 1
work_dir = "/var/lib/zeus-worker"

[executors]
http_allow_domains = []        # điền domain site cần kiểm tra (vd ".zeusvn.vn")
file_roots = ["/var/lib/zeus-worker/work"]
repo_roots = ["/var/lib/zeus-worker/work"]

[executors.shell_allowlist]
disk_usage = ["df", "-h", "/"]
