# Hồ sơ cho máy ERP thử nghiệm: mạng RIÊNG br-erp, đĩa 60 GiB, snapshot giữ 14 ngày.
# cloud-init.user-data được tao-may.sh nạp từ anh-mau/erp/cloud-init-user-data.yaml
name: erp
description: "ERP thử nghiệm: Ubuntu 24.04 + Docker (Odoo mẫu), mạng br-erp cách ly"
config:
  security.secureboot: "true"
  # ERP có dữ liệu: giữ snapshot lâu hơn và vẫn snapshot cả khi máy tắt
  snapshots.expiry: "14d"
  snapshots.schedule.stopped: "true"
devices:
  eth0:
    type: nic
    network: br-erp
    name: eth0
  root:
    type: disk
    pool: may-ao
    path: /
    size: 60GiB
  agent:
    type: disk
    source: agent:config
