<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ title }} · ZEUS Workbench</title>
<link rel="stylesheet" href="{{ prefix }}/static/app.css">
<script src="{{ prefix }}/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="nav-toggle" type="button" aria-label="Mở menu" aria-expanded="false">☰</button>
  <a class="brand" href="{{ prefix }}">ZEUS <span>Workbench</span></a>
  <span class="spacer"></span>
  <button class="icon-btn" id="theme-toggle" type="button" aria-label="Đổi giao diện sáng/tối">◐</button>
  {% if user %}
  <form method="post" action="{{ prefix }}/logout" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <button class="btn ghost" type="submit">Đăng xuất<span class="who"> ({{ user }})</span></button>
  </form>
  {% endif %}
</header>
<div class="shell">
  {% if user %}
  <nav class="side" id="side" aria-label="Điều hướng">
    {% for path, label in nav %}
    <a href="{{ prefix }}{{ path }}" class="{{ 'on' if active == path and (path or title == 'Tổng quan') else '' }}">{{ label }}</a>
    {% endfor %}
  </nav>
  {% endif %}
  <main>
    <h1>{{ title }}</h1>
    {% block body %}{% endblock %}
  </main>
</div>
</body>
</html>
